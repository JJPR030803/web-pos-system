name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome checks
        run: bun run ci

      - name: Type check
        run: bun run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos_user
          POSTGRES_PASSWORD: pos_password
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pos_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Pull k6 Docker image
        run: docker pull grafana/k6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: bun --cwd backend run db:migrate
        env:
          DATABASE_URL: postgres://pos_user:pos_password@localhost:5432/pos_test

      - name: Start backend server
        run: bun --cwd backend run start &
        env:
          DATABASE_URL: postgres://pos_user:pos_password@localhost:5432/pos_test

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run k6 smoke test
        run: docker run --rm --network=host -v ${{ github.workspace }}/backend/k6:/k6 -e BASE_URL=http://localhost:3000 grafana/k6 run /k6/scripts/smoke.js

      - name: Run k6 load test
        run: docker run --rm --network=host -v ${{ github.workspace }}/backend/k6:/k6 -e BASE_URL=http://localhost:3000 grafana/k6 run /k6/scripts/load-auth.js

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build:frontend
